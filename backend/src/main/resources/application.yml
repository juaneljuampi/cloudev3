server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pedidos360}
    username: ${SPRING_DATASOURCE_USERNAME:pedidos}
    password: ${SPRING_DATASOURCE_PASSWORD:cambiar-local}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: pedidos-analitica
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties.spring.json.trusted.packages: cl.pedidos360.*
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    listener.simple.default-requeue-rejected: false
app:
  jwt:
    secret: ${JWT_SECRET:cambiar-por-clave-segura-de-32-caracteres}
    issuer: ${JWT_ISSUER:pedidos360-local}
    jwk-set-uri: ${JWT_JWK_SET_URI:}
  kafka:
    topics:
      created: pedidos.creados
      status: pedidos.estado
      dlq: pedidos.dlq
